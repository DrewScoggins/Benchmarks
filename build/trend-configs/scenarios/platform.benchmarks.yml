  "variables": {
    "serverScheme": "http",
    "serverPort": 5000,
    "urls": "{{serverScheme}}://{{serverAddress}}:{{serverPort}}",
    "benchmarksCommit": "main"
  },
  "jobs": {
    "platformbenchmarks": {
      "source": {
        "repository": "https://github.com/aspnet/benchmarks.git",
        "branchOrCommit": "{{benchmarksCommit}}",
        "project": "src/BenchmarksApps/TechEmpower/PlatformBenchmarks/PlatformBenchmarks.csproj"
      },
      "readyStateText": "Application started.",
      "framework": "net7.0",
      "arguments": "--urls {{urls}}",
      "environmentVariables": {
        "database": "PostgreSQL",
        "connectionString": "Server={{databaseServer}};Database=hello_world;User Id=benchmarkdbuser;Password=benchmarkdbpass;Maximum Pool Size=256;NoResetOnClose=true;Enlist=false;Max Auto Prepare=4"
      }
    },
    "postgresql": {
      "source": {
        "repository": "https://github.com/TechEmpower/FrameworkBenchmarks.git",
        "branchOrCommit": "master",
        "dockerFile": "toolset/databases/postgres/postgres.dockerfile",
        "dockerImageName": "postgres_te",
        "dockerContextDirectory": "toolset/databases/postgres"
      },
      "readyStateText": "ready to accept connections",
      "noClean": true
    }
  },
  "scenarios": {
    "plaintext": {
      "application": {
        "job": "platformbenchmarks"
      },
      "load": {
        "job": "wrk",
        "variables": {
          "presetHeaders": "plaintext",
          "path": "/plaintext",
          "pipeline": 16,
          "connections": 1024
        }
      }
    },
    "json": {
      "application": {
        "job": "platformbenchmarks"
      },
      "load": {
        "job": "wrk",
        "variables": {
          "presetHeaders": "json",
          "path": "/json",
          "connections": 512
        }
      }
    },
    "fortunes": {
      "db": {
        "job": "postgresql"
      },
      "application": {
        "job": "platformbenchmarks",
        "buildArguments": [
          "/p:IsDatabase=true"
        ]
      },
      "load": {
        "job": "wrk",
        "variables": {
          "presetHeaders": "html",
          "path": "/fortunes",
          "connections": 512
        }
      }
    },
    "fortunes_dapper": {
